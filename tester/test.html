<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ChessCode — Auto Test Runner</title>
    <style>
      body {
        font-family: monospace;
        background: #1e1e2e;
        color: #cdd6f4;
        padding: 20px;
      }

      h1 {
        color: #cba6f7;
      }

      .pass {
        color: #a6e3a1;
      }

      .fail {
        color: #f38ba8;
      }

      .info {
        color: #89b4fa;
      }

      .warn {
        color: #f9e2af;
      }

      .section {
        margin: 16px 0 4px;
        font-size: 1.1em;
        color: #fab387;
        border-bottom: 1px solid #313244;
        padding-bottom: 4px;
      }

      #board-frame {
        border: 3px solid #cba6f7;
        margin-top: 20px;
      }

      #log {
        white-space: pre-wrap;
        line-height: 1.7;
      }

      #summary {
        font-size: 1.3em;
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
      }

      .ok {
        background: #1e3a2e;
        border: 1px solid #a6e3a1;
      }

      .bad {
        background: #3a1e1e;
        border: 1px solid #f38ba8;
      }
    </style>
  </head>

  <body>
    <h1>♟️ ChessCode — Live Browser Test</h1>
    <div id="log"></div>
    <div id="summary"></div>
    <h2 style="color: #89b4fa; margin-top: 24px">Live Board (iframe):</h2>
    <iframe
      id="board-frame"
      src="/"
      width="640"
      height="720"
      title="Chess Board"
    ></iframe>

    <script>
      const log = document.getElementById("log");
      const summary = document.getElementById("summary");
      let passed = 0,
        failed = 0;

      function write(cls, msg) {
        const span = document.createElement("span");
        span.className = cls;
        span.textContent = msg + "\n";
        log.appendChild(span);
      }
      function section(title) {
        write("section", "\n" + title);
      }
      function pass(msg) {
        passed++;
        write("pass", "  ✅ " + msg);
      }
      function fail(msg) {
        failed++;
        write("fail", "  ❌ " + msg);
      }
      function info(msg) {
        write("info", "  ℹ️  " + msg);
      }

      // Wait for the iframe to load, then run tests inside it
      const frame = document.getElementById("board-frame");
      frame.addEventListener("load", () => {
        setTimeout(runTests, 800); // give JS a moment to init
      });

      function runTests() {
        let w, km, gd;
        try {
          w = frame.contentWindow;
          km = w.keySquareMapper;
          gd = w.globalData;
        } catch (e) {
          fail("Cannot access iframe globals: " + e.message);
          return;
        }

        if (!km || !gd) {
          fail(
            "keySquareMapper or globalData not found — check index.js exports",
          );
          return;
        }

        info(
          "Board loaded. keySquareMapper has " +
            Object.keys(km).length +
            " squares.",
        );
        info("globalData rows: " + gd.length);

        // ── Helper ────────────────────────────────────────────────────────────
        function sq(id) {
          return km[id];
        }

        section("1️⃣  Initial Board State");
        ["a1", "h1", "a8", "h8"].forEach((id) => {
          if (sq(id) && sq(id).piece)
            pass(id + " has piece: " + sq(id).piece.piece_name);
          else fail(id + " missing piece");
        });
        if (sq("e4") && sq("e4").piece === null)
          pass("e4 is empty (mid-board)");
        else fail("e4 should be empty initially");

        section("2️⃣  White Pieces Present");
        const whitePieces = [
          "WHITE_PAWN",
          "WHITE_ROOK",
          "WHITE_KNIGHT",
          "WHITE_BISHOP",
          "WHITE_QUEEN",
          "WHITE_KING",
        ];
        const allPieces = gd
          .flat()
          .map((s) => s.piece && s.piece.piece_name)
          .filter(Boolean);
        whitePieces.forEach((name) => {
          if (allPieces.includes(name)) pass(name + " on board");
          else fail(name + " MISSING from board");
        });

        section("3️⃣  Black Pieces Present");
        const blackPieces = [
          "BLACK_PAWN",
          "BLACK_ROOK",
          "BLACK_KNIGHT",
          "BLACK_BISHOP",
          "BLACK_QUEEN",
          "BLACK_KING",
        ];
        blackPieces.forEach((name) => {
          if (allPieces.includes(name)) pass(name + " on board");
          else fail(name + " MISSING from board");
        });

        section("4️⃣  Pawn Positions");
        ["a2", "b2", "c2", "d2", "e2", "f2", "g2", "h2"].forEach((id) => {
          const p = sq(id) && sq(id).piece;
          if (p && p.piece_name === "WHITE_PAWN") pass("White pawn at " + id);
          else
            fail(
              "Expected WHITE_PAWN at " +
                id +
                ", got: " +
                (p ? p.piece_name : "null"),
            );
        });
        ["a7", "b7", "c7", "d7", "e7", "f7", "g7", "h7"].forEach((id) => {
          const p = sq(id) && sq(id).piece;
          if (p && p.piece_name === "BLACK_PAWN") pass("Black pawn at " + id);
          else
            fail(
              "Expected BLACK_PAWN at " +
                id +
                ", got: " +
                (p ? p.piece_name : "null"),
            );
        });

        section("5️⃣  DOM Elements Check");
        const doc = frame.contentDocument;
        const root = doc.getElementById("root");
        if (root) pass("#root element exists");
        else fail("#root element NOT found");

        const squares = root ? root.querySelectorAll(".square") : [];
        if (squares.length === 64) pass("64 square divs rendered");
        else fail("Expected 64 squares, found " + squares.length);

        const pieces = root ? root.querySelectorAll(".piece") : [];
        if (pieces.length === 32) pass("32 piece images rendered");
        else fail("Expected 32 piece images, found " + pieces.length);

        section("6️⃣  Simulate White Pawn Click (e2)");
        const e2el = doc.getElementById("e2");
        if (!e2el) {
          fail("Square e2 not found in DOM");
        } else {
          const img = e2el.querySelector("img");
          if (!img) fail("No piece image in e2");
          else {
            img.click();
            setTimeout(() => {
              const e3el = doc.getElementById("e3");
              const e4el = doc.getElementById("e4");
              const e2Highlighted = e2el.classList.contains("highlightYellow");
              const e3HasDot = e3el && e3el.querySelector("span.highlight");
              const e4HasDot = e4el && e4el.querySelector("span.highlight");

              if (e2Highlighted) pass("e2 glows yellow after click");
              else fail("e2 should have highlightYellow class");

              if (e3HasDot) pass("e3 has green move dot");
              else fail("e3 should have green dot after pawn click");

              if (e4HasDot) pass("e4 has green move dot (2-square opening)");
              else fail("e4 should have green dot (first move)");

              section("7️⃣  Move White Pawn e2 → e4");
              if (e4HasDot) {
                e4el.querySelector("span.highlight").click();
                setTimeout(() => {
                  const pawnMoved =
                    sq("e4") &&
                    sq("e4").piece &&
                    sq("e4").piece.piece_name === "WHITE_PAWN";
                  const e2Empty = sq("e2") && sq("e2").piece === null;
                  if (pawnMoved) pass("WHITE_PAWN moved to e4");
                  else
                    fail(
                      "Pawn not at e4: " +
                        JSON.stringify(sq("e4") && sq("e4").piece),
                    );
                  if (e2Empty) pass("e2 is now empty");
                  else fail("e2 should be empty after move");

                  section("8️⃣  Simulate Black Pawn Click (d7)");
                  const d7el = doc.getElementById("d7");
                  const d7img = d7el && d7el.querySelector("img");
                  if (!d7img) {
                    fail("No piece image at d7");
                    showSummary();
                    return;
                  }
                  d7img.click();
                  setTimeout(() => {
                    const d7glow = d7el.classList.contains("highlightYellow");
                    const d5dot =
                      doc.getElementById("d5") &&
                      doc.getElementById("d5").querySelector("span.highlight");
                    if (d7glow) pass("d7 glows yellow");
                    else fail("d7 should glow yellow after click");
                    if (d5dot) pass("d5 has green dot (2-square opening)");
                    else fail("d5 should have green dot");

                    // move d7→d5
                    if (d5dot) {
                      d5dot.click();
                      setTimeout(() => {
                        const bPawnMoved =
                          sq("d5") &&
                          sq("d5").piece &&
                          sq("d5").piece.piece_name === "BLACK_PAWN";
                        if (bPawnMoved) pass("BLACK_PAWN moved to d5");
                        else fail("Black pawn not at d5");

                        section("9️⃣  White Pawn at e4 can capture d5 (enemy)");
                        const e4img2 =
                          doc.getElementById("e4") &&
                          doc.getElementById("e4").querySelector("img");
                        if (e4img2) {
                          e4img2.click();
                          setTimeout(() => {
                            const d5el = doc.getElementById("d5");
                            const d5capture =
                              d5el && d5el.classList.contains("captureColor");
                            if (d5capture)
                              pass(
                                "d5 shows RED capture highlight — pawn capture works!",
                              );
                            else
                              fail("d5 should be RED (pawn capture of enemy)");
                            showSummary();
                          }, 300);
                        } else {
                          fail("No img at e4");
                          showSummary();
                        }
                      }, 300);
                    } else {
                      showSummary();
                    }
                  }, 300);
                }, 300);
              } else {
                showSummary();
              }
            }, 300);
          }
        }
      }

      function showSummary() {
        summary.textContent = `Tests: ${passed} passed, ${failed} failed ${failed === 0 ? "🎉 All passed!" : "⚠️ Some failed"}`;
        summary.className = "summary " + (failed === 0 ? "ok" : "bad");
      }
    </script>
  </body>
</html>
