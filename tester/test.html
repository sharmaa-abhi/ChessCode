<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ChessCode — Auto Test Runner</title>
    <style>
      body {
        font-family: monospace;
        background: #1e1e2e;
        color: #cdd6f4;
        padding: 20px;
      }

      h1 {
        color: #cba6f7;
      }

      .pass {
        color: #a6e3a1;
      }

      .fail {
        color: #f38ba8;
      }

      .info {
        color: #89b4fa;
      }

      .warn {
        color: #f9e2af;
      }

      .section {
        margin: 16px 0 4px;
        font-size: 1.1em;
        color: #fab387;
        border-bottom: 1px solid #313244;
        padding-bottom: 4px;
      }

      #board-frame {
        border: 3px solid #cba6f7;
        margin-top: 20px;
      }

      #log {
        white-space: pre-wrap;
        line-height: 1.7;
      }

      #summary {
        font-size: 1.3em;
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
      }

      .ok {
        background: #1e3a2e;
        border: 1px solid #a6e3a1;
      }

      .bad {
        background: #3a1e1e;
        border: 1px solid #f38ba8;
      }
    </style>
  </head>

  <body>
    <h1>♟️ ChessCode — Live Browser Test</h1>
    <div id="log"></div>
    <div id="summary"></div>
    <h2 style="color: #89b4fa; margin-top: 24px">Live Board (iframe):</h2>
    <iframe
      id="board-frame"
      src="/"
      width="640"
      height="720"
      title="Chess Board"
    ></iframe>

    <script>
      const log = document.getElementById("log");
      const summary = document.getElementById("summary");
      let passed = 0,
        failed = 0;

      function write(cls, msg) {
        const span = document.createElement("span");
        span.className = cls;
        span.textContent = msg + "\n";
        log.appendChild(span);
      }
      function section(title) {
        write("section", "\n" + title);
      }
      function pass(msg) {
        passed++;
        write("pass", "  ✅ " + msg);
      }
      function fail(msg) {
        failed++;
        write("fail", "  ❌ " + msg);
      }
      function info(msg) {
        write("info", "  ℹ️  " + msg);
      }

      // Wait for the iframe to load, then run tests inside it
      const frame = document.getElementById("board-frame");
      frame.addEventListener("load", () => {
        setTimeout(runTests, 800); // give JS a moment to init
      });

      function runTests() {
        let w, km, gd;
        try {
          w = frame.contentWindow;
          km = w.keySquareMapper;
          gd = w.globalData;
        } catch (e) {
          fail("Cannot access iframe globals: " + e.message);
          return;
        }

        if (!km || !gd) {
          fail(
            "keySquareMapper or globalData not found — check index.js exports",
          );
          return;
        }

        info(
          "Board loaded. keySquareMapper has " +
            Object.keys(km).length +
            " squares.",
        );
        info("globalData rows: " + gd.length);

        // ── Helper ────────────────────────────────────────────────────────────
        function sq(id) {
          return km[id];
        }

        function setBoardSquare(id, pieceObj) {
          const square = sq(id);
          if (square) {
            square.piece = pieceObj;
            const el = doc.getElementById(id);
            if (el) {
              el.innerHTML = "";
              if (pieceObj) {
                const img = doc.createElement("img");
                img.src = pieceObj.img;
                img.className = "piece";
                el.appendChild(img);
              }
            }
          }
        }

        section("1️⃣  Initial Board State");
        ["a1", "h1", "a8", "h8"].forEach((id) => {
          if (sq(id) && sq(id).piece)
            pass(id + " has piece: " + sq(id).piece.piece_name);
          else fail(id + " missing piece");
        });
        if (sq("e4") && sq("e4").piece === null)
          pass("e4 is empty (mid-board)");
        else fail("e4 should be empty initially");

        section("2️⃣  White Pieces Present");
        const whitePieces = [
          "WHITE_PAWN",
          "WHITE_ROOK",
          "WHITE_KNIGHT",
          "WHITE_BISHOP",
          "WHITE_QUEEN",
          "WHITE_KING",
        ];
        const allPieces = gd
          .flat()
          .map((s) => s.piece && s.piece.piece_name)
          .filter(Boolean);
        whitePieces.forEach((name) => {
          if (allPieces.includes(name)) pass(name + " on board");
          else fail(name + " MISSING from board");
        });

        section("3️⃣  Black Pieces Present");
        const blackPieces = [
          "BLACK_PAWN",
          "BLACK_ROOK",
          "BLACK_KNIGHT",
          "BLACK_BISHOP",
          "BLACK_QUEEN",
          "BLACK_KING",
        ];
        blackPieces.forEach((name) => {
          if (allPieces.includes(name)) pass(name + " on board");
          else fail(name + " MISSING from board");
        });

        section("4️⃣  Pawn Positions");
        ["a2", "b2", "c2", "d2", "e2", "f2", "g2", "h2"].forEach((id) => {
          const p = sq(id) && sq(id).piece;
          if (p && p.piece_name === "WHITE_PAWN") pass("White pawn at " + id);
          else
            fail(
              "Expected WHITE_PAWN at " +
                id +
                ", got: " +
                (p ? p.piece_name : "null"),
            );
        });
        ["a7", "b7", "c7", "d7", "e7", "f7", "g7", "h7"].forEach((id) => {
          const p = sq(id) && sq(id).piece;
          if (p && p.piece_name === "BLACK_PAWN") pass("Black pawn at " + id);
          else
            fail(
              "Expected BLACK_PAWN at " +
                id +
                ", got: " +
                (p ? p.piece_name : "null"),
            );
        });

        section("5️⃣  DOM Elements Check");
        const doc = frame.contentDocument;
        const root = doc.getElementById("root");
        if (root) pass("#root element exists");
        else fail("#root element NOT found");

        const squares = root ? root.querySelectorAll(".square") : [];
        if (squares.length === 64) pass("64 square divs rendered");
        else fail("Expected 64 squares, found " + squares.length);

        const pieces = root ? root.querySelectorAll(".piece") : [];
        if (pieces.length === 32) pass("32 piece images rendered");
        else fail("Expected 32 piece images, found " + pieces.length);

        section("6️⃣  Simulate White Pawn Click (e2)");
        const e2el = doc.getElementById("e2");
        if (!e2el) {
          fail("Square e2 not found in DOM");
        } else {
          const img = e2el.querySelector("img");
          if (!img) fail("No piece image in e2");
          else {
            img.click();
            setTimeout(() => {
              const e3el = doc.getElementById("e3");
              const e4el = doc.getElementById("e4");
              const e2Highlighted = e2el.classList.contains("highlightYellow");
              const e3HasDot = e3el && e3el.querySelector("span.highlight");
              const e4HasDot = e4el && e4el.querySelector("span.highlight");

              if (e2Highlighted) pass("e2 glows yellow after click");
              else fail("e2 should have highlightYellow class");

              if (e3HasDot) pass("e3 has green move dot");
              else fail("e3 should have green dot after pawn click");

              if (e4HasDot) pass("e4 has green move dot (2-square opening)");
              else fail("e4 should have green dot (first move)");

              section("7️⃣  Move White Pawn e2 → e4");
              if (e4HasDot) {
                e4el.querySelector("span.highlight").click();
                setTimeout(() => {
                  const pawnMoved =
                    sq("e4") &&
                    sq("e4").piece &&
                    sq("e4").piece.piece_name === "WHITE_PAWN";
                  const e2Empty = sq("e2") && sq("e2").piece === null;
                  if (pawnMoved) pass("WHITE_PAWN moved to e4");
                  else
                    fail(
                      "Pawn not at e4: " +
                        JSON.stringify(sq("e4") && sq("e4").piece),
                    );
                  if (e2Empty) pass("e2 is now empty");
                  else fail("e2 should be empty after move");

                  section("8️⃣  Simulate Black Pawn Click (d7)");
                  const d7el = doc.getElementById("d7");
                  const d7img = d7el && d7el.querySelector("img");
                  if (!d7img) {
                    fail("No piece image at d7");
                    showSummary();
                    return;
                  }
                  d7img.click();
                  setTimeout(() => {
                    const d7glow = d7el.classList.contains("highlightYellow");
                    const d5dot =
                      doc.getElementById("d5") &&
                      doc.getElementById("d5").querySelector("span.highlight");
                    if (d7glow) pass("d7 glows yellow");
                    else fail("d7 should glow yellow after click");
                    if (d5dot) pass("d5 has green dot (2-square opening)");
                    else fail("d5 should have green dot");

                    // move d7→d5
                    if (d5dot) {
                      d5dot.click();
                      setTimeout(() => {
                        const bPawnMoved =
                          sq("d5") &&
                          sq("d5").piece &&
                          sq("d5").piece.piece_name === "BLACK_PAWN";
                        if (bPawnMoved) pass("BLACK_PAWN moved to d5");
                        else fail("Black pawn not at d5");

                        section("9️⃣  White Pawn at e4 can capture d5 (enemy)");
                        const e4img2 =
                          doc.getElementById("e4") &&
                          doc.getElementById("e4").querySelector("img");
                        if (e4img2) {
                          e4img2.click();
                          setTimeout(() => {
                            const d5el = doc.getElementById("d5");
                            const d5capture =
                              d5el && d5el.classList.contains("captureColor");
                            if (d5capture)
                              pass(
                                "d5 shows RED capture highlight — pawn capture works!",
                              );
                            else
                              fail("d5 should be RED (pawn capture of enemy)");
                            runPawnPromotionTests();
                          }, 300);
                        } else {
                          fail("No img at e4");
                          runPawnPromotionTests();
                        }
                      }, 300);
                    } else {
                      showSummary();
                    }
                  }, 300);
                }, 300);
              } else {
                showSummary();
              }
            }, 300);
          }
        }

        function runPawnPromotionTests() {
          section("🔟  Pawn Promotion (White pawn to 8th rank)");
          setBoardSquare("a7", {
            current_Position: "a7",
            img: "./Assets/pieces/white/pawn.png",
            piece_name: "WHITE_PAWN",
          });
          setBoardSquare("a8", null);
          w.setInTurn("white");

          const a7el = doc.getElementById("a7");
          const a7img = a7el && a7el.querySelector("img");
          if (!a7img) {
            fail("No white pawn image at a7");
            showSummary();
            return;
          }

          a7img.click();
          setTimeout(() => {
            const a7glow = a7el.classList.contains("highlightYellow");
            const a8el = doc.getElementById("a8");
            const a8dot = a8el && a8el.querySelector("span.highlight");
            if (a7glow) pass("a7 glows yellow after click");
            else fail("a7 should glow yellow");
            if (a8dot) pass("a8 has green dot (move ahead)");
            else fail("a8 should have green dot");

            if (a8dot) {
              a8dot.click();
              setTimeout(() => {
                const modal = doc.querySelector(".modal-container");
                if (modal) pass("Pawn promotion modal is displayed");
                else {
                  fail("Pawn promotion modal not found");
                  showSummary();
                  return;
                }

                const modalImgs = modal.querySelectorAll("img");
                if (modalImgs.length === 4) pass("Modal has 4 piece options");
                else fail("Expected 4 options in modal, found " + modalImgs.length);

                // Click Queen (last image)
                if (modalImgs.length > 0) {
                  modalImgs[3].click();
                  setTimeout(() => {
                    const modalClosed = !doc.querySelector(".modal-container");
                    const pieceAtA8 = sq("a8") && sq("a8").piece;
                    const a8img = a8el && a8el.querySelector("img");
                    const a7empty = sq("a7") && sq("a7").piece === null;

                    if (modalClosed) pass("Pawn promotion modal is closed after selection");
                    else fail("Modal should be closed");

                    if (pieceAtA8 && pieceAtA8.piece_name === "WHITE_QUEEN") pass("a8 piece is WHITE_QUEEN in globalData");
                    else fail("Expected WHITE_QUEEN at a8");

                    if (a8img && a8img.src.includes("queen.png")) pass("a8 square renders Queen image in DOM");
                    else fail("a8 should render Queen image");

                    if (a7empty) pass("a7 is empty after move");
                    else fail("a7 should be empty");

                    if (w.getInTurn() === "black") pass("Turn changed to black");
                    else fail("Turn should be black");

                    // Proceed to Black Pawn Promotion
                    runBlackPawnPromotionTests();
                  }, 300);
                } else {
                  showSummary();
                }
              }, 300);
            } else {
              showSummary();
            }
          }, 300);
        }

        function runBlackPawnPromotionTests() {
          section("11. Pawn Promotion (Black pawn to 1st rank)");
          setBoardSquare("b2", {
            current_Position: "b2",
            img: "./Assets/pieces/black/pawn.png",
            piece_name: "BLACK_PAWN",
          });
          setBoardSquare("b1", null);
          w.setInTurn("black");

          const b2el = doc.getElementById("b2");
          const b2img = b2el && b2el.querySelector("img");
          if (!b2img) {
            fail("No black pawn image at b2");
            showSummary();
            return;
          }

          b2img.click();
          setTimeout(() => {
            const b2glow = b2el.classList.contains("highlightYellow");
            const b1el = doc.getElementById("b1");
            const b1dot = b1el && b1el.querySelector("span.highlight");
            if (b2glow) pass("b2 glows yellow after click");
            else fail("b2 should glow yellow");
            if (b1dot) pass("b1 has green dot (move ahead)");
            else fail("b1 should have green dot");

            if (b1dot) {
              b1dot.click();
              setTimeout(() => {
                const modal = doc.querySelector(".modal-container");
                if (modal) pass("Pawn promotion modal is displayed for black");
                else {
                  fail("Pawn promotion modal not found for black");
                  showSummary();
                  return;
                }

                const modalImgs = modal.querySelectorAll("img");
                if (modalImgs.length === 4) pass("Modal has 4 piece options for black");
                else fail("Expected 4 options in modal for black, found " + modalImgs.length);

                // Click Queen (last image)
                if (modalImgs.length > 0) {
                  modalImgs[3].click();
                  setTimeout(() => {
                    const modalClosed = !doc.querySelector(".modal-container");
                    const pieceAtB1 = sq("b1") && sq("b1").piece;
                    const b1img = b1el && b1el.querySelector("img");
                    const b2empty = sq("b2") && sq("b2").piece === null;

                    if (modalClosed) pass("Pawn promotion modal is closed after black selection");
                    else fail("Modal should be closed");

                    if (pieceAtB1 && pieceAtB1.piece_name === "BLACK_QUEEN") pass("b1 piece is BLACK_QUEEN in globalData");
                    else fail("Expected BLACK_QUEEN at b1");

                    if (b1img && b1img.src.includes("queen.png")) pass("b1 square renders Queen image in DOM");
                    else fail("b1 should render Queen image");

                    if (b2empty) pass("b2 is empty after move");
                    else fail("b2 should be empty");

                    if (w.getInTurn() === "white") pass("Turn changed back to white");
                    else fail("Turn should be white");

                    showSummary();
                  }, 300);
                } else {
                  showSummary();
                }
              }, 300);
            } else {
              showSummary();
            }
          }, 300);
        }
      }

      function showSummary() {
        summary.textContent = `Tests: ${passed} passed, ${failed} failed ${failed === 0 ? "🎉 All passed!" : "⚠️ Some failed"}`;
        summary.className = "summary " + (failed === 0 ? "ok" : "bad");
      }
    </script>
  </body>
</html>
