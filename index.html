<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChessCode</title>
  <link rel="stylesheet" href="./style/style.css" />
  <link rel="stylesheet" href="./style/mobile.css" />
</head>

<body>
  <header class="app-header">
    <div class="header-content">
      <div class="logo-area">
        <span class="logo-icon">♟️</span>
        <h1 class="app-title">ChessCode</h1>
        <span class="badge">v1.0</span>
      </div>
      <div class="header-actions">
        <div id="game-status" class="status-indicator white-turn">
          <span class="status-dot"></span>
          <span id="status-text">White's Turn</span>
        </div>
      </div>
    </div>
  </header>

  <main id="flex">
    <div class="board-container">
      <div id="root"></div>
    </div>
    <div class="side-panel">
      <div class="timers-widget">
        <div class="timer-card black-card">
          <div class="timer-player-info">
            <span class="player-dot black-dot"></span>
            <span class="player-name">Black</span>
          </div>
          <div id="black-timer" class="timer">10:00</div>
        </div>
        <div class="timer-card white-card">
          <div class="timer-player-info">
            <span class="player-dot white-dot"></span>
            <span class="player-name">White</span>
          </div>
          <div id="white-timer" class="timer">10:00</div>
        </div>
      </div>
      <div id="chessboardmovelogger">
        <div class="logger-header">Moves</div>
        <ol></ol>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <div class="footer-left">
        <p>&copy; 2026 ChessCode. Built with Vanilla JS & CSS.</p>
      </div>
      <div class="footer-right">
        <a href="./docs/README.md" class="footer-link">Documentation</a>
        <span class="footer-divider">|</span>
        <span class="footer-link">Open Source</span>
      </div>
    </div>
  </footer>

  <script type="module" src="./index.js"></script>
</body>

</html>
